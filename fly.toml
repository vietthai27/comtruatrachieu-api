# Cấu hình Fly.io cho backend. Deploy: cd be && fly deploy
# Bí mật (DB_*, APP_JWT_SECRET, VIETQR_*, APP_CORS_ALLOWED_ORIGINS) đặt bằng `fly secrets`, KHÔNG ghi vào file này.
# Tên app phải duy nhất trên toàn Fly.io — đổi nếu `fly launch`/`fly apps create` báo trùng.
app = "comtruatrachieu-api"
primary_region = "sin" # Singapore, gần Việt Nam nhất

[build]
  dockerfile = "Dockerfile"

[env]
  SPRING_PROFILES_ACTIVE = "postgres"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  # Tự tắt khi không có ai dùng, có request thì tự bật lại (tiết kiệm tiền; lần đầu chờ ~10-20s Spring khởi động)
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
