# Bật bằng SPRING_PROFILES_ACTIVE=postgres (hoặc --spring.profiles.active=postgres)
# Thông tin kết nối lấy từ biến môi trường / file .env (xem .env.example) — không ghi mật khẩu vào đây
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=${DB_SSLMODE:require}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
