# fly.toml app configuration file generated for comtruatrachieu-api on 2026-10-14T04:49:18Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'comtruatrachieu-api'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'
  SPRING_PROFILES_ACTIVE = 'postgres'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 100
    soft_limit = 50

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
