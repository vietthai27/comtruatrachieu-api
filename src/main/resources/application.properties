server.port=${PORT:8080}
# Chạy ngoài Docker: nạp bí mật từ file .env ở thư mục gốc dự án (chạy từ gốc hoặc từ be/). Docker Compose tự truyền .env vào.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
vietqr.base-url=https://api.vietqr.io
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:*}
# Lấy từ https://my.vietqr.io - nên set bằng biến môi trường VIETQR_CLIENT_ID / VIETQR_API_KEY
vietqr.client-id=${VIETQR_CLIENT_ID:aa}
vietqr.api-key=${VIETQR_API_KEY:aa}
# Thành viên được lưu vào file H2 tại be/data/
spring.datasource.url=jdbc:h2:file:./data/comtrua
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Khoá ký JWT (HS256, >= 32 ký tự). Môi trường thật PHẢI đặt APP_JWT_SECRET riêng
app.jwt.secret=${APP_JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
app.jwt.ttl-days=30
# Mật khẩu mặc định khi tự tạo tài khoản cho các thành viên có sẵn (chỉ chạy khi chưa có tài khoản nào)
app.seed.default-password=${APP_SEED_DEFAULT_PASSWORD:abc123}
# Tài khoản quản trị (chỉ admin được thêm/sửa/xoá thành viên); tạo lúc khởi động nếu chưa có
app.admin.username=admin
app.admin.password=${APP_ADMIN_PASSWORD:admin123}
